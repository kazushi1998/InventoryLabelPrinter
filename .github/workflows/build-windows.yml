name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build unpacked Windows app
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload unpacked app artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLabelPrinter-Windows-Unpacked
          path: dist/win-unpacked/**

      - name: Build portable executable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLabelPrinter-Windows-Portable
          path: dist/*.exe
